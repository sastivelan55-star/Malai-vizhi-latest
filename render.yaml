# render.yaml — Render.com Blueprint for MALAI VIZHI
# Defines the Python Flask API web service and the React Static Site frontend

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Flask API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: malai-vizhi-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: malai-vizhi-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: malai-vizhi-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

